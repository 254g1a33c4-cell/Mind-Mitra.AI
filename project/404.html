<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Page Not Found — MindMate</title>
<style>
  :root{
    --bg:#eef4ee; --surface:#ffffff; --ink:#16281d; --ink-soft:#4a5f52; --line:#d3e2d4;
    --primary:#1f6b48; --primary-dark:#144a32; --primary-tint:#e3f1e8;
    --accent:#c98a3a; --accent-tint:#fbeed9;
    --radius-lg:28px; --shadow:0 10px 30px rgba(20,45,30,0.10);
    --font-display:Georgia,"Times New Roman",serif;
    --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1c14; --surface:#16281d; --ink:#eaf3ec; --ink-soft:#a9c2b2; --line:#274633;
      --primary:#4caf7d; --primary-dark:#2f8f5b; --primary-tint:#1c3324; --accent:#e0a856; --accent-tint:#2c2013;
      --shadow:0 10px 30px rgba(0,0,0,0.45);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-size:18px;line-height:1.5;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);
    max-width:480px;width:100%;padding:44px 32px;text-align:center;}
  .mark{width:96px;height:96px;margin:0 auto 20px;border-radius:28px;background:var(--primary-tint);
    display:flex;align-items:center;justify-content:center;font-size:48px;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  @media (prefers-reduced-motion: reduce){ .mark{animation:none;} }
  h1{font-family:var(--font-display);font-size:1.6rem;margin:0 0 6px;color:var(--ink);}
  .code{color:var(--primary);font-weight:800;letter-spacing:0.04em;font-size:0.9rem;margin-bottom:14px;}
  p{color:var(--ink-soft);margin:0 0 26px;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;
    border-radius:999px;padding:16px 28px;font-weight:800;font-size:1.05rem;text-decoration:none;min-height:56px;}
  .btn:hover{background:var(--primary-dark);}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="mark" aria-hidden="true">🧠</div>
    <p class="code">404 — PAGE NOT FOUND</p>
    <h1>Oops! This page seems to have slipped out of memory.</h1>
    <p>Don't worry — let's help you find your way back to cognitive games and memory assistance.</p>
    <a class="btn" href="./index.html">← Back to Home</a>
  </main>
</body>
</html>
